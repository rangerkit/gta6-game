<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Palm Vice: an original open-world crime game in a sun-soaked coastal city. Steal cars, work missions, outrun the PVPD. Runs fully offline.">
<meta name="theme-color" content="#14313d">
<title>Palm Vice — an open-world crime game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14313d; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Palm Vice: an open-world crime game. Explore a coastal city on foot and by car, work missions, and outrun the police. WASD to move, F to interact, mouse to aim."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
